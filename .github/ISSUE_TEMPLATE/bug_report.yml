name: Bug report
description: Report a bug in dsh-session-pin
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for reporting a bug! Before submitting, please search the
        [existing issues](https://github.com/PerryLink/dsh-session-pin/issues)
        to avoid duplicates.
  - type: input
    id: version
    attributes:
      label: Package version
      description: The `dsh-session-pin` version you are running (see `package.json`, or the Plugins page of DSH settings).
      placeholder: 'e.g. 0.3.0'
    validations:
      required: true
  - type: input
    id: harness-version
    attributes:
      label: DeepSeek Harness version
      description: The DSH generation you are running (see the About dialog, or `dsh --version`).
      placeholder: 'e.g. 0.1.0-rc.6, or a commit hash for newer builds'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node version
      description: Operating system plus the Node.js version that runs `dsh web`.
      placeholder: 'e.g. Windows 11, Node 22.5.1'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that lead to the bug.
      placeholder: |
        1. Pin a session in the sidebar
        2. Hover another row
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead (error messages and screenshots welcome).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        Relevant logs: browser console, `.dsh-web.log`, gateway output.

        > **⚠️ Sanitize before pasting — never include tokens, API keys,
        > authorization headers, session cookies, or any other secrets.
        > Replace them with placeholders such as `REDACTED`.**
      render: shell
